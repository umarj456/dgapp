# Kamailio TLS for WSS. Certificates from Let's Encrypt for sip.dialergiants.com (certbot, deploy hook reloads kamailio).
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/letsencrypt/live/sip.dialergiants.com/privkey.pem
certificate = /etc/letsencrypt/live/sip.dialergiants.com/fullchain.pem

[client:default]
verify_certificate = no
require_certificate = no
