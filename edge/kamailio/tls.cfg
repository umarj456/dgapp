# WSS certificate for the no-DNS lab. Generate the files with the openssl command in EDGE_DEPLOY.md.
# They live under /opt/dgapp-edge/certs and are not committed.
# When sip.dialergiants.com exists, point these two paths at the Let's Encrypt fullchain and privkey
# and run `kamcmd tls.reload`. DNS is optional for the lab.
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /opt/dgapp-edge/certs/privkey.pem
certificate = /opt/dgapp-edge/certs/fullchain.pem

[client:default]
verify_certificate = no
require_certificate = no
