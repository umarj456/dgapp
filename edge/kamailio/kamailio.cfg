#!KAMAILIO
#
# DG App edge: WebRTC (WSS) registrar/proxy in front of SIPNAV.
# NOT DEPLOYED. Lab target is 138.201.138.161 on ports that avoid Asterisk (UDP 5060)
# and the DID portal (TCP 8080). See EDGE_DEPLOY.md. Kamailio 6.0.x + rtpengine (userspace).
#
#  App users  --WSS/SRTP-->  [this edge]  --UDP/RTP-->  SIPNAV "DG App" account (IP-auth, tech prefix)
#  SIPNAV DID --UDP/RTP-->   [this edge]  --WSS/SRTP--> all registered devices of the DID owner
#
# Call control is delegated to the DG App API (/internal/v1/*): digest HA1 lookup, KYC + fraud +
# prepaid pre-auth (max call duration), inbound DID -> owner, and CDR/settlement on hangup.
#
# All values below in UPPERCASE substdefs are PLACEHOLDERS. Real values come from
# /etc/kamailio/dg-local.cfg on the server (not in git). No credentials in this file.

import_file "dg-local.cfg"

