####### Flags #######
#!define FLT_SRC_WS 1
#!define FLT_DLG 4
#!define FLT_OUTBOUND 8
#!define FLT_INBOUND 9
#!define FLB_DST_WS 10
#!define FLB_NATB 6
#!define FLB_NATSIPPING 7

#!define API_HDRS "Authorization: Bearer API_TOKEN\r\nContent-Type: application/json"

####### Routing logic #######
request_route {
	route(REQINIT);

	if ($proto == "ws" || $proto == "wss") {
		setflag(FLT_SRC_WS);
	}

	route(NATDETECT);

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	if (has_totag()) {
		route(WITHINDLG);
		exit;
	}

	t_check_trans();
	remove_hf("Route");
	if (is_method("INVITE|SUBSCRIBE")) {
		record_route();
	}

	# ---- Traffic from SIPNAV (inbound DIDs) ----
	if ($si == "SIPNAV_IP" && !isflagset(FLT_SRC_WS)) {
		if (is_method("INVITE")) {
			route(FROM_SIPNAV);
		} else if (is_method("OPTIONS")) {
			sl_send_reply("200", "OK");
		} else {
			sl_send_reply("405", "Method Not Allowed");
		}
		exit;
	}

	# ---- Everything else must be an app user over WSS ----
	if (!isflagset(FLT_SRC_WS)) {
		sl_send_reply("403", "Forbidden");
		exit;
	}

	if (is_method("REGISTER")) {
		route(REGISTRAR);
		exit;
	}

	if (is_method("INVITE")) {
		route(AUTH);
		route(FROM_APP);
		exit;
	}

	if (is_method("OPTIONS")) {
		sl_send_reply("200", "OK");
		exit;
	}

	sl_send_reply("405", "Method Not Allowed");
	exit;
}

route[REQINIT] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		exit;
	}
	# Wholesale signalling is not scanner traffic. Do not pike-ban SIPNAV.
	if ($si == "SIPNAV_IP") return;
	if ($sht(ipban=>$si) != $null) {
		exit;
	}
	if (!pike_check_req()) {
		xlog("L_ALERT", "pike blocking $rm from $fu ($si:$sp)\n");
		$sht(ipban=>$si) = 1;
		exit;
	}
	if ($ua =~ "friendly|sipvicious|sipcli|VaxSIPUserAgent") {
		$sht(ipban=>$si) = 1;
		exit;
	}
}

route[NATDETECT] {
	force_rport();
	if (nat_uac_test("19") || isflagset(FLT_SRC_WS)) {
		if (is_method("REGISTER")) {
			fix_nated_register();
		} else if (is_first_hop()) {
			set_contact_alias();
		}
		setbflag(FLB_NATB);
	}
}

route[WITHINDLG] {
	if (loose_route()) {
		route(DLGURI);
		if (is_method("BYE")) {
			setflag(FLT_DLG);
		} else if (is_method("ACK")) {
			route(NATMANAGE);
		} else if (is_method("NOTIFY")) {
			record_route();
		}
		route(RELAY);
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

route[DLGURI] {
	if (!isdsturiset()) {
		handle_ruri_alias();
	}
}

# Digest auth with HA1 fetched from the API. Sets $var(aor).
route[AUTH] {
	if (!is_present_hf("Authorization") && !is_present_hf("Proxy-Authorization")) {
		auth_challenge("SIP_DOMAIN", "1");
		exit;
	}
	$var(code) = http_client_query("API_URL/internal/v1/sip/auth?username=$(au{s.escape.param})", "", API_HDRS, "$var(res)");
	if ($var(code) != 200) {
		auth_challenge("SIP_DOMAIN", "1");
		exit;
	}
	jansson_get("ha1", "$var(res)", "$var(ha1)");
	jansson_get("aor", "$var(res)", "$var(aor)");
	if (is_method("REGISTER")) {
		if (!pv_www_authenticate("SIP_DOMAIN", "$var(ha1)", "1")) {
			auth_challenge("SIP_DOMAIN", "1");
			exit;
		}
	} else {
		if (!pv_proxy_authenticate("SIP_DOMAIN", "$var(ha1)", "1")) {
			auth_challenge("SIP_DOMAIN", "1");
			exit;
		}
	}
	# the authenticated device may only act as its own user
	if ($fU != $var(aor)) {
		sl_send_reply("403", "Identity mismatch");
		exit;
	}
	consume_credentials();
}

route[REGISTRAR] {
	route(AUTH);
	if ($tU != $var(aor)) {
		sl_send_reply("403", "Identity mismatch");
		exit;
	}
	if (isflagset(FLT_SRC_WS)) {
		setbflag(FLB_NATB);
	}
	if (!save("location")) {
		sl_reply_error();
	}
	exit;
}

# ---- Outbound: app user -> SIPNAV ----
route[FROM_APP] {
	setflag(FLT_OUTBOUND);
	$var(body) = '{"call_id":"' + $(ci{s.escape.common}) + '","aor":"' + $var(aor) + '","auth_username":"' + $(au{s.escape.common}) + '","destination":"' + $(rU{s.escape.common}) + '"}';
	$var(code) = http_client_query("API_URL/internal/v1/calls/authorize", "$var(body)", API_HDRS, "$var(res)");
	if ($var(code) != 200) {
		xlog("L_ERR", "authorize API failed code=$var(code)\n");
		sl_send_reply("503", "Service Unavailable");
		exit;
	}
	jansson_get("allow", "$var(res)", "$var(allow)");
	if ($var(allow) != 1) {
		jansson_get("sip_code", "$var(res)", "$var(sip_code)");
		jansson_get("reason", "$var(res)", "$var(reason)");
		xlog("L_NOTICE", "call denied $fU -> $rU: $var(reason)\n");
		send_reply("$var(sip_code)", "$var(reason)");
		exit;
	}
	jansson_get("max_duration", "$var(res)", "$var(maxdur)");
	jansson_get("caller_id", "$var(res)", "$var(cid)");
	jansson_get("ruri_user", "$var(res)", "$var(ruser)");
	jansson_get("auth_id", "$var(res)", "$var(auth_id)");

	# Dialog tracking: hard stop at the pre-authorized max duration (prepaid), CDR on end.
	dlg_manage();
	dlg_set_timeout("$var(maxdur)");
	$dlg_var(auth_id) = $var(auth_id);

	# Caller ID = the user's DID. Never trust client-supplied identity headers.
	remove_hf("P-Asserted-Identity");
	remove_hf("P-Preferred-Identity");
	remove_hf("Remote-Party-ID");
	uac_replace_from("", "sip:$var(cid)@EDGE_PUBLIC_IP");
	append_hf("P-Asserted-Identity: <sip:$var(cid)@EDGE_PUBLIC_IP>\r\n");

	# R-URI: tech prefix + E.164 destination, to the SIPNAV DG App endpoint (IP-authenticated).
	$ru = "sip:" + $var(ruser) + "@SIPNAV_IP:SIPNAV_PORT";
	$du = $null;
	$fs = "udp:EDGE_PRIVATE_IP:EDGE_SIP_PORT";

	t_on_failure("FAIL_OUT");
	route(RELAY);
	exit;
}

# ---- Inbound: SIPNAV DID -> all devices of the owner ----
route[FROM_SIPNAV] {
	setflag(FLT_INBOUND);
	$var(body) = '{"call_id":"' + $(ci{s.escape.common}) + '","did":"' + $(rU{s.escape.common}) + '","from":"' + $(fU{s.escape.common}) + '"}';
	$var(code) = http_client_query("API_URL/internal/v1/calls/inbound", "$var(body)", API_HDRS, "$var(res)");
	if ($var(code) != 200) {
		sl_send_reply("503", "Service Unavailable");
		exit;
	}
	jansson_get("allow", "$var(res)", "$var(allow)");
	if ($var(allow) != 1) {
		sl_send_reply("404", "Not Found");
		exit;
	}
	jansson_get("aor", "$var(res)", "$var(aor)");
	dlg_manage();

	$ru = "sip:" + $var(aor) + "@SIP_DOMAIN";
	if (!lookup("location")) {
		# Phase 2: send VoIP push (PushKit / FCM) via the API here and suspend the transaction
		# (tsilo / t_suspend) until the app registers. Phase 1: user is offline.
		route(CDR_END_ZERO);
		sl_send_reply("480", "Temporarily Unavailable");
		exit;
	}
	t_on_branch("BRANCH_IN");
	t_on_failure("FAIL_IN");
	route(RELAY);
	exit;
}

branch_route[BRANCH_IN] {
	if ($ru =~ "transport=ws") {
		setbflag(FLB_DST_WS);
	}
	route(NATMANAGE);
}

route[RELAY] {
	if (is_method("INVITE|BYE|UPDATE|CANCEL|ACK")) {
		dlg_manage();
	}
	if (is_method("INVITE") && !isflagset(FLT_INBOUND)) {
		route(NATMANAGE);
	}
	if (is_method("INVITE|UPDATE")) {
		t_on_reply("REPLY");
	}
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# rtpengine: WebRTC (ICE/DTLS-SRTP/rtcp-mux) <-> plain RTP for SIPNAV.
route[NATMANAGE] {
	if (!has_body("application/sdp")) return;
	if (isflagset(FLT_SRC_WS)) {
		# offer from app towards SIPNAV
		rtpengine_manage("replace-origin replace-session-connection rtcp-mux-demux DTLS=off SDES-off ICE=remove RTP/AVP");
	} else if (isbflagset(FLB_DST_WS)) {
		# offer from SIPNAV towards an app
		rtpengine_manage("replace-origin replace-session-connection rtcp-mux-offer generate-mid DTLS=passive SDES-off ICE=force UDP/TLS/RTP/SAVPF");
	} else {
		rtpengine_manage("replace-origin replace-session-connection");
	}
}

onreply_route[REPLY] {
	if (has_body("application/sdp")) {
		if (isflagset(FLT_SRC_WS)) {
			# answer from SIPNAV going back to the app
			rtpengine_manage("replace-origin replace-session-connection rtcp-mux-require generate-mid DTLS=passive SDES-off ICE=force UDP/TLS/RTP/SAVPF");
		} else if (isbflagset(FLB_DST_WS)) {
			# answer from the app going back to SIPNAV
			rtpengine_manage("replace-origin replace-session-connection rtcp-mux-demux DTLS=off SDES-off ICE=remove RTP/AVP");
		} else {
			rtpengine_manage("replace-origin replace-session-connection");
		}
	}
	if (nat_uac_test("1") || isbflagset(FLB_DST_WS)) {
		set_contact_alias();
	}
}

failure_route[FAIL_OUT] {
	if (t_is_canceled()) {
		route(CDR_END_ZERO);
		exit;
	}
	# No LCR failover here: SIPNAV does carrier routing. Release the hold.
	route(CDR_END_ZERO);
}

failure_route[FAIL_IN] {
	route(CDR_END_ZERO);
}

# Unanswered / failed call: settle with billsec=0 so the prepaid hold is released.
route[CDR_END_ZERO] {
	$var(body) = '{"call_id":"' + $(ci{s.escape.common}) + '","billsec":0,"sip_code":' + $T_reply_code + '}';
	http_client_query("API_URL/internal/v1/calls/end", "$var(body)", API_HDRS, "$var(r)");
	rtpengine_delete();
}

# Answered call ended (BYE from either side, or max-duration timeout with send_bye).
event_route[dialog:end] {
	$var(billsec) = $TS - $dlg(start_ts);
	$var(body) = '{"call_id":"' + $(dlg(callid){s.escape.common}) + '","billsec":' + $var(billsec) + ',"sip_code":200,"hangup_cause":"normal"}';
	$var(code) = http_client_query("API_URL/internal/v1/calls/end", "$var(body)", API_HDRS, "$var(r)");
	if ($var(code) != 200) {
		# The API also expires stale holds; this is logged for reconciliation against SIPNAV CDRs.
		xlog("L_ERR", "CDR post failed callid=$dlg(callid) billsec=$var(billsec) code=$var(code)\n");
	}
}

# WebSocket handshake for WSS clients.
event_route[xhttp:request] {
	set_reply_close();
	set_reply_no_connect();
	if ($Rp != EDGE_WSS_PORT) {
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}
	if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm =~ "GET") {
		# Browser Origin is the web UI, not the WSS host. Lab UI is http://127.0.0.1:4200 (SSH tunnel).
		if ($hdr(Origin) != "WS_ORIGIN_1" && $hdr(Origin) != "WS_ORIGIN_2"
				&& $hdr(Origin) != "WS_ORIGIN_3" && $hdr(Origin) != "WS_ORIGIN_4") {
			xlog("L_WARN", "WS from bad origin $hdr(Origin)\n");
			xhttp_reply("403", "Forbidden", "", "");
			exit;
		}
		if (ws_handle_handshake()) {
			exit;
		}
	}
	xhttp_reply("404", "Not Found", "", "");
}

event_route[websocket:closed] {
	xlog("L_INFO", "WebSocket connection from $si:$sp has closed\n");
}
