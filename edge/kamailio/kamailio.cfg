####### Global parameters #######
debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
children=8
tcp_children=8
auto_aliases=no
server_header="Server: DG"
user_agent_header="User-Agent: DG"
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_max_connections=4096
enable_tls=yes

# WSS for apps. Lab port 18443, not 8443 (dialer-monitor owns 8443 on this host).
# UDP towards SIPNAV on 15060, not 5060 (Asterisk owns UDP 5060 on this host).
# Do not add a listen on TCP 8080: nginx serves the DID portal there.
listen=tls:EDGE_PRIVATE_IP:EDGE_WSS_PORT advertise EDGE_PUBLIC_IP:EDGE_WSS_PORT
listen=udp:EDGE_PRIVATE_IP:EDGE_SIP_PORT advertise EDGE_PUBLIC_IP:EDGE_SIP_PORT

alias=SIP_DOMAIN

