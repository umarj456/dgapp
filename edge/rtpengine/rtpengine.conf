# rtpengine for the DG App lab edge on 138.201.138.161. Not deployed.
# Userspace forwarding only (table = -1): do not build or load the kernel module on this host.
[rtpengine]
table = -1
# Single public address on the NIC. Later, a private NIC would be: private/<ip>!public/138.201.138.161
interface = 138.201.138.161
listen-ng = 127.0.0.1:2223
# Narrow range so this lab does not take Asterisk's media ports. Confirm no overlap before opening the firewall.
port-min = 35000
port-max = 35999
timeout = 60
silent-timeout = 3600
final-timeout = 14700
tos = 184
delete-delay = 0
log-level = 6
log-facility = local1
# Per-call Kamailio flags choose the DTLS role. Leave the daemon default off.
dtls-passive = false
