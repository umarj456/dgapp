# rtpengine for the DG App edge. DRAFT - placeholders.
[rtpengine]
table = 0
# private!public address for NAT'd Hetzner setups; same IP twice if the NIC has the public IP
interface = 10.0.0.10!203.0.113.10
listen-ng = 127.0.0.1:2223
port-min = 30000
port-max = 40000
timeout = 60
silent-timeout = 3600
final-timeout = 14700
tos = 184
delete-delay = 0
log-level = 6
log-facility = local1
# DTLS-SRTP for WebRTC clients
dtls-passive = false
